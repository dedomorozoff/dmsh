name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            goos: linux
            goarch: amd64
            ext: ""
            metal_flags: ""
          - os: macos-13
            goos: darwin
            goarch: amd64
            ext: ""
            metal_flags: "-DGGML_METAL=OFF -DGGML_BLAS=OFF"
          - os: macos-latest
            goos: darwin
            goarch: arm64
            ext: ""
            metal_flags: "-DGGML_METAL=OFF -DGGML_BLAS=OFF"
          - os: windows-latest
            goos: windows
            goarch: amd64
            ext: ".exe"
            metal_flags: ""

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Install deps (Linux)
        if: matrix.goos == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake

      - name: Install deps (macOS)
        if: matrix.goos == 'darwin'
        run: brew install cmake

      - name: Build llama.cpp
        run: |
          cmake -G "Unix Makefiles" -S third_party/llama.cpp -B third_party/llama.cpp/build -DBUILD_SHARED_LIBS=OFF -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=OFF -DLLAMA_BUILD_TOOLS=OFF -DLLAMA_BUILD_SERVER=OFF -DGGML_NATIVE=OFF -DCMAKE_BUILD_TYPE=Release ${{ matrix.metal_flags }}
          cmake --build third_party/llama.cpp/build --config Release --parallel 2

      - name: Build dmsh
        shell: bash
        run: |
          mkdir -p bin
          case "$GITHUB_REF_NAME" in
            v*) VERSION="${GITHUB_REF_NAME#v}" ;;
            *)  VERSION="dev" ;;
          esac
          BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          go build -tags llama \
            -ldflags="-s -w -X github.com/dedomorozoff/dmsh/internal/cli.Version=$VERSION -X github.com/dedomorozoff/dmsh/internal/cli.BuildDate=$BUILD_DATE" \
            -o "bin/dmsh${{ matrix.ext }}" ./cmd/dmsh
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 1

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dmsh-${{ matrix.goos }}-${{ matrix.goarch }}
          path: bin/dmsh${{ matrix.ext }}

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - uses: actions/checkout@v5

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release

      - name: Package
        run: |
          mkdir -p dist
          for dir in release/dmsh-*; do
            name=$(basename "$dir")
            if [[ "$name" == *"windows"* ]]; then
              cp "$dir/dmsh.exe" "dist/${name}.exe"
            else
              tar -czf "dist/${name}.tar.gz" -C "$dir" .
            fi
          done
          ls -la dist/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          draft: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
