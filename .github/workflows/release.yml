name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            goos: linux
            goarch: amd64
            ext: ""
            metal_flags: ""
            cmake_arch: ""
          - os: macos-latest
            goos: darwin
            goarch: amd64
            ext: ""
            metal_flags: "-DGGML_METAL=OFF -DGGML_BLAS=OFF"
            cmake_arch: "-DCMAKE_OSX_ARCHITECTURES=x86_64"
          - os: macos-latest
            goos: darwin
            goarch: arm64
            ext: ""
            metal_flags: "-DGGML_METAL=OFF -DGGML_BLAS=OFF"
            cmake_arch: "-DCMAKE_OSX_ARCHITECTURES=arm64"
          - os: windows-latest
            goos: windows
            goarch: amd64
            ext: ".exe"
            metal_flags: ""
            cmake_arch: ""

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Install deps (Linux)
        if: matrix.goos == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake

      - name: Install deps (macOS)
        if: matrix.goos == 'darwin'
        run: brew install cmake

      - name: Build llama.cpp
        run: |
          cmake -G "Unix Makefiles" -S third_party/llama.cpp -B third_party/llama.cpp/build -DBUILD_SHARED_LIBS=OFF -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=OFF -DLLAMA_BUILD_TOOLS=OFF -DLLAMA_BUILD_SERVER=OFF -DGGML_NATIVE=OFF -DCMAKE_BUILD_TYPE=Release ${{ matrix.metal_flags }} ${{ matrix.cmake_arch }}
          cmake --build third_party/llama.cpp/build --config Release --parallel 2

      - name: Build dmsh
        shell: bash
        run: |
          mkdir -p bin
          case "$GITHUB_REF_NAME" in
            v*) VERSION="${GITHUB_REF_NAME#v}" ;;
            *)  VERSION="dev" ;;
          esac
          BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          go build -tags llama \
            -ldflags="-s -w -X github.com/dedomorozoff/dmsh/internal/cli.Version=$VERSION -X github.com/dedomorozoff/dmsh/internal/cli.BuildDate=$BUILD_DATE" \
            -o "bin/dmsh${{ matrix.ext }}" ./cmd/dmsh
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 1

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dmsh-${{ matrix.goos }}-${{ matrix.goarch }}
          path: bin/dmsh${{ matrix.ext }}

  build-cuda:
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Install deps + CUDA toolkit
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake
          wget https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/x86_64/cuda-keyring_1.1-1_all.deb
          sudo dpkg -i cuda-keyring_1.1-1_all.deb
          sudo apt-get update
          sudo apt-get install -y cuda-toolkit-12-5

      - name: Build llama.cpp (CUDA)
        shell: bash
        run: |
          export PATH="/usr/local/cuda/bin:$PATH"
          cmake -G "Unix Makefiles" -S third_party/llama.cpp -B third_party/llama.cpp/build \
            -DBUILD_SHARED_LIBS=OFF -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=OFF \
            -DLLAMA_BUILD_TOOLS=OFF -DLLAMA_BUILD_SERVER=OFF -DGGML_NATIVE=OFF \
            -DGGML_CUDA=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build third_party/llama.cpp/build --config Release --parallel 2
          echo "=== ggml-cuda output libs ==="
          find third_party/llama.cpp/build -name "*ggml-cuda*" | sort

      - name: Build dmsh (CUDA)
        shell: bash
        run: |
          set -e
          mkdir -p bin
          case "$GITHUB_REF_NAME" in
            v*) VERSION="${GITHUB_REF_NAME#v}" ;;
            *)  VERSION="dev" ;;
          esac
          BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          # libcuda lives in the driver; toolkit ships a link stub for CI/no-GPU builds.
          export CGO_LDFLAGS="-L/usr/local/cuda/lib64 -L/usr/local/cuda/lib64/stubs"
          go build -tags "llama cuda" \
            -ldflags="-s -w -X github.com/dedomorozoff/dmsh/internal/cli.Version=$VERSION -X github.com/dedomorozoff/dmsh/internal/cli.BuildDate=$BUILD_DATE" \
            -o bin/dmsh ./cmd/dmsh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dmsh-linux-amd64-cuda
          path: bin/*

  # Windows CUDA requires MSVC: MinGW cannot link the NVIDIA CUDA toolkit.
  build-cuda-windows:
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install CUDA toolkit
        uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: '12.5.0'
          method: network
          sub-packages: '["nvcc", "cudart", "cublas", "cublas_dev", "visual_studio_integration"]'

      - name: Build llama.cpp (CUDA / MSVC)
        shell: pwsh
        run: |
          # Ninja + cl avoids hard-coding a Visual Studio generator year
          # (windows-latest moved from VS 17/2022 to VS 18).
          # CUDA 12.5 nvcc only allowlists MSVC through VS 2022; override for VS 18.
          cmake -G Ninja -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl `
            -DCMAKE_CUDA_COMPILER="$env:CUDA_PATH\bin\nvcc.exe" `
            -DCMAKE_CUDA_FLAGS="-allow-unsupported-compiler" `
            -S third_party/llama.cpp -B third_party/llama.cpp/build `
            -DBUILD_SHARED_LIBS=OFF -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=OFF `
            -DLLAMA_BUILD_TOOLS=OFF -DLLAMA_BUILD_SERVER=OFF -DGGML_NATIVE=OFF `
            -DGGML_OPENMP=OFF -DGGML_CUDA=ON
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build third_party/llama.cpp/build --config Release --parallel 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host "=== CUDA / ggml libs ==="
          Get-ChildItem -Recurse third_party/llama.cpp/build -Include *.lib |
            Where-Object { $_.Name -match 'llama|ggml' } |
            ForEach-Object { $_.FullName }

      - name: Build dmsh (CUDA / MSVC)
        shell: pwsh
        env:
          CGO_ENABLED: '1'
          CC: cl.exe
          CXX: cl.exe
        run: |
          New-Item -ItemType Directory -Force -Path bin | Out-Null
          $version = if ($env:GITHUB_REF_NAME -like 'v*') { $env:GITHUB_REF_NAME.Substring(1) } else { 'dev' }
          $buildDate = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ')
          $cudaLib = Join-Path $env:CUDA_PATH 'lib\x64'
          # Drop MinGW from PATH so cgo uses MSVC link.exe, not gcc's.
          $env:Path = ($env:Path -split ';' | Where-Object { $_ -notmatch '(?i)mingw|msys' }) -join ';'
          $env:CGO_LDFLAGS = "-L`"$cudaLib`""
          $env:CGO_LDFLAGS_ALLOW = '.*'
          go build -tags 'llama cuda' `
            -ldflags "-s -w -X github.com/dedomorozoff/dmsh/internal/cli.Version=$version -X github.com/dedomorozoff/dmsh/internal/cli.BuildDate=$buildDate" `
            -o bin/dmsh.exe ./cmd/dmsh

      - name: Copy CUDA runtime DLLs
        shell: pwsh
        run: |
          $cudaBin = Join-Path $env:CUDA_PATH 'bin'
          Get-ChildItem $cudaBin -Filter 'cudart64*.dll' | Copy-Item -Destination bin/ -Force
          Get-ChildItem $cudaBin -Filter 'cublas64*.dll' | Copy-Item -Destination bin/ -Force
          Get-ChildItem $cudaBin -Filter 'cublasLt64*.dll' | Copy-Item -Destination bin/ -Force
          Get-ChildItem bin | Format-Table Name, Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dmsh-windows-amd64-cuda
          path: bin/*

  package:
    needs: build
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Download Linux binary
        uses: actions/download-artifact@v4
        with:
          name: dmsh-linux-amd64
          path: bin

      - name: Move binary to expected name
        run: mv bin/dmsh bin/dmsh-linux-amd64

      - name: Build FreeBSD (stub) binary
        run: |
          GOOS=freebsd GOARCH=amd64 CGO_ENABLED=0 go build -o bin/dmsh-freebsd-amd64 ./cmd/dmsh

      - name: Generate man pages
        run: go run ./cmd/genman

      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y dpkg-dev rpm

      - name: Build .deb
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist/deb/usr/bin dist/deb/usr/share/man/man1 dist/deb/DEBIAN
          cp bin/dmsh-linux-amd64 dist/deb/usr/bin/dmsh
          cp man/* dist/deb/usr/share/man/man1/
          cat > dist/deb/DEBIAN/control <<EOF
          Package: dmsh
          Version: ${VERSION}
          Section: utils
          Priority: optional
          Architecture: amd64
          Maintainer: dedomorozoff <alexl@dmsh>
          Description: Direct Model Shell (dmsh)
          EOF
          dpkg-deb --build dist/deb "bin/dmsh-${VERSION}-amd64.deb"

      - name: Build .rpm
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist/rpmbuild/BUILD dist/rpmbuild/RPMS dist/rpmbuild/SOURCES dist/rpmbuild/SPECS dist/rpmbuild/SRPMS
          cp bin/dmsh-linux-amd64 dist/rpmbuild/SOURCES/dmsh
          cp -r man dist/rpmbuild/SOURCES/man
          cat > dist/rpmbuild/SPECS/dmsh.spec <<EOF
          Name: dmsh
          Version: ${VERSION}
          Release: 1%{?dist}
          Summary: Direct Model Shell
          License: MIT
          %description
          Direct Model Shell
          %install
          mkdir -p %{buildroot}%{_bindir} %{buildroot}%{_mandir}/man1
          install -m 755 %{_sourcedir}/dmsh %{buildroot}%{_bindir}/dmsh
          install -m 644 %{_sourcedir}/man/* %{buildroot}%{_mandir}/man1/
          %files
          %{_bindir}/dmsh
          %{_mandir}/man1/*
          EOF
          rpmbuild --define "_topdir $(pwd)/dist/rpmbuild" -bb dist/rpmbuild/SPECS/dmsh.spec
          cp dist/rpmbuild/RPMS/*/*.rpm bin/

      - name: Build Linux tarball
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist/linux/bin dist/linux/share/man/man1
          cp bin/dmsh-linux-amd64 dist/linux/bin/dmsh
          cp man/* dist/linux/share/man/man1/
          cp README.md dist/linux/
          tar -czf "bin/dmsh-${VERSION}-linux-amd64.tar.gz" -C dist/linux bin share README.md

      - name: Build FreeBSD tarball
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist/freebsd/bin dist/freebsd/share/man/man1
          cp bin/dmsh-freebsd-amd64 dist/freebsd/bin/dmsh
          cp man/* dist/freebsd/share/man/man1/
          cp README.md dist/freebsd/
          tar -czf "bin/dmsh-${VERSION}-freebsd-amd64.tar.gz" -C dist/freebsd bin share README.md

      - name: Build Arch Linux package (makepkg)
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed "s/@VERSION@/${VERSION}/" packaging/PKGBUILD.prebuilt > PKGBUILD.ci
          tar -czf man.tar.gz man
          docker run --rm -v "$(pwd)":/build -w /build archlinux/archlinux:latest bash -c \
            "pacman -Syu --noconfirm --needed base-devel &&
             useradd -m builder &&
             mkdir -p /build/work && chown -R builder /build/work &&
             cp /build/bin/dmsh-linux-amd64 /build/work/dmsh &&
             cp /build/man.tar.gz /build/work/man.tar.gz &&
             cp /build/PKGBUILD.ci /build/work/PKGBUILD &&
             su builder -c 'cd /build/work && makepkg -f'"
          cp work/*.pkg.tar.zst bin/

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: dmsh-packages
          path: |
            bin/dmsh-*.deb
            bin/dmsh-*.rpm
            bin/dmsh-*-linux-amd64.tar.gz
            bin/dmsh-*-freebsd-amd64.tar.gz
            bin/dmsh-*.pkg.tar.zst

  release:
    # Wait for CUDA jobs so artifacts are present when packaging.
    # CUDA jobs have continue-on-error, so a CUDA failure still allows a CPU-only release.
    needs: [build, package, build-cuda, build-cuda-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - uses: actions/checkout@v5

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release

      - name: Package
        run: |
          mkdir -p dist
          for dir in release/dmsh-*; do
            name=$(basename "$dir")
            [[ "$name" == "dmsh-packages" ]] && continue
            # Single-file Windows CPU exe stays as .exe; CUDA Windows (exe+DLLs) and
            # everything else ship as tar.gz so companion DLLs are preserved.
            file_count=$(find "$dir" -type f | wc -l)
            if [[ "$name" == *"windows"* && "$file_count" -eq 1 ]]; then
              cp "$dir"/*.exe "dist/${name}.exe"
            else
              tar -czf "dist/${name}.tar.gz" -C "$dir" .
            fi
          done
          cp release/dmsh-packages/* dist/ 2>/dev/null || true
          ls -la dist/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          draft: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
